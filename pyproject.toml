[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "garslopcli"
version = "0.1.0"
description = "Zero-dependency command and flag parsing for Python CLIs"
readme = "README.md"
requires-python = ">=3.14"
authors = [{ name = "Spencer Banasik", email = "smbanasik@gmail.com" }]
keywords = ["cli", "command-line", "argument-parser", "flags", "commands"]
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/garslopcli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
